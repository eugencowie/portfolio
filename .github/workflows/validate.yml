name: Validate

on:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/setup@v3.1.2
        # Re-run install scripts on every job: Playwright downloads Chromium outside
        # the cached store, so a cached "already built" mark would leave no browser.
        env: { pnpm_config_side_effects_cache: false }
        with: { cache: true }
      - run: pnpm run validate
      - uses: actions/upload-artifact@v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
