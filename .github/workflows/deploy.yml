#
# Deploy to production on every push to main.
#
# Repository secrets
# - CLOUDFLARE_ACCOUNT_ID: the account that owns the worker.
# - CLOUDFLARE_API_TOKEN: a user API token with the following permissions:
#   - Account Settings: Read
#   - Workers Scripts: Edit
#   - User Details: Read
#
# Repository variables
# - SITE_URL: the public URL of the site, used for canonical links.
#

name: Deploy

on:
  push:
    branches: [main]

# Queue deploys so two quick merges cannot race to go live out of order.
concurrency:
  group: deploy

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        env: { pnpm_config_pm_on_fail: ignore } # https://github.com/pnpm/setup/issues/34
        with: { cache: true }
      - run: pnpm run build --site "${{ vars.SITE_URL }}"
      - uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ github.token }}
